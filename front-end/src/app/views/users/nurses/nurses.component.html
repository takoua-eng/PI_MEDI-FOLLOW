<div class="patients-page">
  <div class="header">
    <h2>Nurses</h2>
    <div class="actions">
      <input class="search" type="text" [(ngModel)]="searchTerm" placeholder="Rechercher par nom ou département" />
      <button class="btn-add" (click)="addNew()">Ajouter</button>
    </div>
  </div>

  <c-row class="g-4">
    <c-col xl="3" lg="4" sm="6" *ngFor="let n of filtered; let i = index">
      <c-widget-stat-a (click)="goToDetail(n)" [title]="n.department" [color]="i % 4 === 0 ? 'primary' : i % 4 === 1 ? 'info' : i % 4 === 2 ? 'warning' : 'danger'">
        <ng-template cTemplateId="widgetValueTemplate" ngPreserveWhitespaces>
          <div class="widget-sub">{{ n.name }}</div>
        </ng-template>
        <ng-template cTemplateId="widgetActionTemplate">
          <c-dropdown alignment="end" variant="btn-group" (click)="$event.stopPropagation()">
            <button [caret]="false" cButton cDropdownToggle class="p-0 text-white" color="transparent" aria-label="Open dropdown" (click)="openMenu($event,n.id)">
              <svg cIcon name="cilOptions"></svg>
            </button>
            <ul cDropdownMenu>
              <li><button cDropdownItem (click)="goToEdit(n)">Modifier</button></li>
              <li><button cDropdownItem (click)="delete(n)">Supprimer</button></li>
            </ul>
          </c-dropdown>
        </ng-template>
        <ng-template cTemplateId="widgetChartTemplate">
          <div class="widget-footer">
            <a (click)="$event.stopPropagation(); goToDetail(n)" role="button">Voir plus <span class="arrow">→</span></a>
          </div>
        </ng-template>
      </c-widget-stat-a>
    </c-col>
  </c-row>
  
  
</div>
