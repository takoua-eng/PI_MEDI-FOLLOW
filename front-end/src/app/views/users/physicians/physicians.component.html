<div class="patients-page">
	<div class="header">
		<h2>Physicians</h2>
		<div class="actions">
			<input class="search" type="text" [(ngModel)]="searchTerm" placeholder="Rechercher par nom ou spécialité" />
			<button class="btn-add" (click)="addNew()">Ajouter</button>
		</div>
	</div>

		<c-row class="g-4">
			<c-col xl="3" lg="4" sm="6" *ngFor="let p of filtered; let i = index">
				<c-widget-stat-a (click)="goToDetail(p)" [title]="p.name" [color]="i % 4 === 0 ? 'primary' : i % 4 === 1 ? 'info' : i % 4 === 2 ? 'warning' : 'danger'">
				<ng-template cTemplateId="widgetValueTemplate" ngPreserveWhitespaces>
					{{ p.specialty }}
				</ng-template>
				<ng-template cTemplateId="widgetActionTemplate">
					<c-dropdown alignment="end" variant="btn-group">
						<button [caret]="false" cButton cDropdownToggle class="p-0 text-white" color="transparent" aria-label="Open dropdown">
							<svg cIcon name="cilOptions"></svg>
						</button>
						<ul cDropdownMenu>
							<li><button cDropdownItem (click)="goToEdit(p)">Modifier</button></li>
							<li><button cDropdownItem (click)="delete(p)">Supprimer</button></li>
						</ul>
					</c-dropdown>
				</ng-template>
				<ng-template cTemplateId="widgetChartTemplate">
					<div class="widget-footer">
						<a (click)="$event.stopPropagation(); goToDetail(p)" role="button">Voir plus <span class="arrow">→</span></a>
					</div>
				</ng-template>
			</c-widget-stat-a>
		</c-col>
	</c-row>

</div>
